# Pinned model IDs and prices. Every trace line records model + model_version.
# Rule 6 (SKILL.md): when a model changes, rerun `make eval` and diff before accepting.
# Verified live on 2026-09-11 via `make models` (lists generateContent-capable Gemini
# models and the Anthropic models endpoint).
version: 1
extractors:
  gemini:
    family: gemini
    model: gemini-3.8-flash          # newest GA flash; not a *-preview id on purpose
    alternatives: [gemini-3.1-pro-preview, gemini-2.5-pro]
    price_per_1m_input_usd: 0.75      # ai.google.dev pricing page, updated 2026-09-08; rises to 1.50 on 2027-01-01
    price_per_1m_output_usd: 3.75     # rises to 7.50 on 2027-01-01
  claude:
    family: claude
    model: claude-opus-5
    alternatives: [claude-sonnet-5]
    price_per_1m_input_usd: 5.00
    price_per_1m_output_usd: 25.00
triage:
  family: claude
  model: claude-opus-5
  price_per_1m_input_usd: 5.00
  price_per_1m_output_usd: 25.00
extraction:
  prompt_version: extract_v2      # v2 = v1 wording generalised to any trade document + index_* fields (CS4)
  claude_effort: medium          # ADR-15: medium first, sweep to high in a logged rerun
  gemini_thinking_level: medium  # google-genai ThinkingConfig.thinking_level; null = provider default
  max_output_tokens_gemini: 32000   # cap INCLUDES thinking tokens on Gemini 3.x; medium thinking used ~3-8k
  max_output_tokens_claude: 16000   # includes adaptive-thinking tokens; non-streaming safe
  temperature: 0
  timeout_s: 240        # per HTTP request; the SDKs retry twice on transient errors
  deadline_s: 540       # HARD wall clock per model call (thread deadline); SDK timeouts alone let calls run for hours
