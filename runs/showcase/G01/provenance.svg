s" x="287" y="54">mixedbread · high_quality</text><text class="m" x="287" y="67" fill="#1f7a4d">2 pages · 4.2 s</text></g></a><a xlink:href="extraction_gemini.json" href="extraction_gemini.json" target="_blank"><g><title>Reads the document into the versioned schema: every field is cited to a verbatim span or explicitly declared absent. Never decides anything.</title><rect x="536" y="16" width="176" height="92" rx="7" fill="#e8eef5" stroke="#3a5a7a" stroke-width="1.3"/><text class="t" x="547" y="37">extract · gemini</text><text class="s" x="547" y="54">gemini-3.8-flash</text><text class="m" x="547" y="67" fill="#3a5a7a">reused from</text><text class="m" x="547" y="79" fill="#3a5a7a">20260913-105614 · 20</text><text class="b" x="702" y="36" text-anchor="end" fill="#3a5a7a">CACHED</text></g></a><a xlink:href="extraction_claude.json" href="extraction_claude.json" target="_blank"><g><title>Reads the document into the versioned schema: every field is cited to a verbatim span or explicitly declared absent. Never decides anything.</title><rect x="536" y="124" width="176" height="92" rx="7" fill="#e8eef5" stroke="#3a5a7a" stroke-width="1.3"/><text class="t" x="547" y="145">extract · claude</text><text class="s" x="547" y="162">claude-opus-5</text><text class="m" x="547" y="175" fill="#3a5a7a">reused from</text><text class="m" x="547" y="187" fill="#3a5a7a">20260913-105614 · 20</text><text class="b" x="702" y="144" text-anchor="end" fill="#3a5a7a">CACHED</text></g></a><a xlink:href="booking.json" href="booking.json" target="_blank"><g><title>MCP tool: the only path to books and records, in the eval and in the live service alike.</title><rect x="536" y="232" width="176" height="92" rx="7" fill="#e6f4ec" stroke="#1f7a4d" stroke-width="1.3"/><text class="t" x="547" y="253">booking_lookup()</text><text class="s" x="547" y="270">mcp-stdio</text><text class="m" x="547" y="283" fill="#1f7a4d">FOUND · 42 ms</text></g></a><a xlink:href="merged.json" href="merged.json" target="_blank"><g><title>Canonical forms in code (per-quarter vs per-annum, date formats, enums), then the two families are compared to each other. Disagreement is a finding, never arbitrated.</title><rect x="796" y="16" width="176" height="92" rx="7" fill="#e6f4ec" stroke="#1f7a4d" stroke-width="1.3"/><text class="t" x="807" y="37">normalize + merge</text><text class="s" x="807" y="54">deterministic, unit-tested</text><text class="m" x="807" y="67" fill="#1f7a4d">26/26 fields agree</text></g></a><a xlink:href="findings.json" href="findings.json" target="_blank"><g><title>The match / no-match call. No model is consulted here: this is the line the product rests on.</title><rect x="1056" y="16" width="176" height="92" rx="7" fill="#fff3d6" stroke="#8a5a00" stroke-width="1.3"/><text class="t" x="1067" y="37">compare</text><text class="s" x="1067" y="54">tolerance table, in code</text><text class="m" x="1067" y="67" fill="#8a5a00">26 checks · 1 mismatch</text></g></a><g><title>Term-sheet claims about the index checked against the methodology's own rules.</title><rect x="1056" y="124" width="176" height="92" rx="7" fill="#e6f4ec" stroke="#1f7a4d" stroke-width="1.3"/><text class="t" x="1067" y="145">reference check</text><text class="s" x="1067" y="162">claims vs the rulebook</text></g><a xlink:href="auto_clear.json" href="auto_clear.json" target="_blank"><g><title>Agree and pass → auto-clear with zero human touch. Anything else is a typed finding.</title><rect x="1316" y="16" width="176" height="92" rx="7" fill="#fff3d6" stroke="#8a5a00" stroke-width="1.3"/><text class="t" x="1327" y="37">lanes</text><text class="s" x="1327" y="54">autonomy earned per field</text><text class="m" x="1327" y="67" fill="#8a5a00">25 auto-cleared · 1 to</text><text class="m" x="1327" y="79" fill="#8a5a00">triage</text></g></a><a xlink:href="triage.json" href="triage.json" target="_blank"><g><title>The only place a model writes prose: it explains a finding code already made and drafts the query, given the finding and its citations, never the whole document.</title><rect x="1316" y="124" width="176" height="92" rx="7" fill="#e6f4ec" stroke="#1f7a4d" stroke-width="1.3"/><text class="t" x="1327" y="145">triage · desk query</text><text class="s" x="1327" y="162">claude-opus-5</text><text class="m" x="1327" y="175" fill="#1f7a4d">1 drafted</text></g></a><a xlink:href="summary.json" href="summary.json" target="_blank"><g><title>The result is bound to the document hash and to the hash of the booking fields that affect the terms of the deal, so a fixing never disturbs it and an amendment expires it.</title><rect x="1316" y="232" width="176" height="92" rx="7" fill="#e6f4ec" stroke="#1f7a4d" stroke-width="1.3"/><text class="t" x="1327" y="253">findings + attestation</text><text class="s" x="1327" y="270">clean 25 · mismatch 1</text><text class="m" x="1327" y="283" fill="#1f7a4d">doc 613bf846 · terms</text><text class="m" x="1327" y="295" fill="#1f7a4d">55598ac1 (26 fields)</text></g></a><text class="k" x="16" y="360">G01 · SN-2026-0101 · source pdf · $0.181 for the readings · every box links to the artifact it produced</text><rect x="16" y="368" width="9" height="9" rx="2" fill="#1f7a4d"/><text class="k" x="29" y="376">completed</text><rect x="84.6" y="368" width="9" height="9" rx="2" fill="#3a5a7a"/><text class="k" x="97.6" y="376">reused under an unchanged hash</text><rect x="266.6" y="368" width="9" height="9" rx="2" fill="#b3261e"/><text class="k" x="279.6" y="376">never completed</text><rect x="367.6" y="368" width="9" height="9" rx="2" fill="#3f3b34"/><text class="k" x="380.6" y="376">code, no model</text></svg>